<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - Quản lý tổ dân phố</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/form.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
        <p class="auth-subtitle">Hệ thống Quản lý Tổ dân phố</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="fullName">Họ và tên</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="fullName" placeholder="Nguyễn Văn A" required>
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="regEmail" placeholder="canbo@todanpho.vn" required>
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword">Mật khẩu</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnRegister">
          <span>Tạo tài khoản</span>
          <i class="fa-solid fa-user-check"></i>
        </button>
      </form>

      <p id="authMessage" class="auth-message"></p>

      <div class="auth-footer">
        Đã có tài khoản? <a href="./login.html" class="register-link">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
